<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>夜航简报 - 返回按钮方案对比</title>
  <style>
    :root {
      --ink: #1a1410;
      --parchment: #e8d5b7;
      --parchment-dim: #a89880;
      --ember: #d97757;
      --wine: #5c2a2a;
      --slate: #3a322d;
      --card: #231b16;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0d0a08;
      color: var(--parchment);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      padding: 20px;
    }
    .outer {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      font-size: 18px;
      font-weight: 500;
      margin: 0 0 20px;
      color: var(--parchment);
    }
    .scenario-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .scenario-tab {
      padding: 10px 18px;
      border: 1px solid rgba(232, 213, 183, 0.25);
      background: transparent;
      color: var(--parchment-dim);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .scenario-tab.active {
      background: var(--ember);
      color: var(--ink);
      border-color: var(--ember);
      font-weight: 600;
    }
    .phone-frame {
      width: 360px;
      height: 680px;
      border: 8px solid #2a2520;
      border-radius: 36px;
      background: var(--ink);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      float: left;
      margin-right: 32px;
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Cover page */
    .cover-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #2a1f1a 0%, #1a1410 100%);
    }
    .cover-overlay {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.55);
    }
    .cover-content {
      position: absolute;
      bottom: 80px;
      left: 28px;
      right: 28px;
      z-index: 5;
    }
    .cover-greeting {
      font-size: 22px;
      margin-bottom: 16px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    }
    .cover-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
    }
    .btn {
      padding: 10px 20px;
      background: var(--ember);
      color: var(--ink);
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(217, 119, 87, 0.25);
    }
    .btn-secondary {
      background: transparent;
      color: var(--parchment);
      border: 1px solid rgba(232, 213, 183, 0.35);
      box-shadow: none;
    }

    /* Briefing page */
    .briefing-screen {
      width: 100%;
      height: 100%;
      background: var(--ink);
      display: flex;
      flex-direction: column;
    }
    .briefing-body {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 28px;
    }
    .briefing-title {
      font-size: 20px;
      margin: 0 0 6px;
      padding-top: 24px;
    }
    .briefing-meta {
      color: var(--parchment-dim);
      font-size: 12px;
      margin-bottom: 20px;
    }
    .briefing-card {
      background: var(--card);
      border: 1px solid rgba(232, 213, 183, 0.12);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 12px;
    }
    .briefing-card h3 {
      font-size: 14px;
      color: var(--ember);
      margin: 0 0 10px;
      font-weight: 500;
    }
    .briefing-card p {
      font-size: 13px;
      margin: 0 0 8px;
      color: rgba(232, 213, 183, 0.85);
    }

    /* Nav variants */
    .nav-a {
      padding: 14px 16px;
    }
    .nav-a .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--parchment-dim);
      font-size: 13px;
      cursor: pointer;
    }
    .nav-b {
      padding: 14px 16px;
      display: flex;
      justify-content: flex-end;
    }
    .nav-c {
      padding: 12px 16px;
      background: rgba(35, 27, 22, 0.95);
      border-bottom: 1px solid rgba(232, 213, 183, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-c .back {
      color: var(--parchment-dim);
      font-size: 13px;
    }
    .nav-c .date {
      color: var(--ember);
      font-size: 12px;
    }
    .nav-bottom {
      position: absolute;
      bottom: 24px;
      left: 20px;
      z-index: 10;
    }

    .controls {
      overflow: hidden;
    }
    .control-group {
      margin-bottom: 24px;
    }
    .control-group h3 {
      font-size: 14px;
      color: var(--parchment-dim);
      margin: 0 0 10px;
      font-weight: 500;
    }
    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 1px solid rgba(232, 213, 183, 0.2);
      background: var(--card);
      color: var(--parchment);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .option-btn.active {
      border-color: var(--ember);
      background: rgba(217, 119, 87, 0.12);
    }
    .option-btn .label {
      font-weight: 600;
      color: var(--ember);
      margin-right: 8px;
    }
    .note {
      color: var(--parchment-dim);
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.6;
    }
    .clear { clear: both; }
  </style>
</head>
<body>
  <div class="outer">
    <h1>夜航简报 · 返回按钮方案对比</h1>

    <div class="scenario-tabs">
      <button class="scenario-tab active" data-scenario="cover">封面入口</button>
      <button class="scenario-tab" data-scenario="briefing">夜航简报页</button>
    </div>

    <div class="phone-frame">
      <div class="phone-screen" id="screen">
        <!-- dynamic -->
      </div>
    </div>

    <div class="controls">
      <div class="control-group" id="cover-controls">
        <h3>封面入口布局</h3>
        <button class="option-btn active" data-cover="vertical">
          <span class="label">A</span> 垂直双按钮（点亮灯火 + 夜航简报）
        </button>
        <button class="option-btn" data-cover="horizontal">
          <span class="label">B</span> 水平双按钮
        </button>
        <div class="note">建议：垂直排列更符合现有 Cover 的左下角布局，"点亮灯火"保持主按钮，"夜航简报"作为次按钮。</div>
      </div>

      <div class="control-group" id="briefing-controls" style="display:none">
        <h3>夜航简报页返回方案</h3>
        <button class="option-btn active" data-back="a">
          <span class="label">A</span> 左上角返回箭头
        </button>
        <button class="option-btn" data-back="b">
          <span class="label">B</span> 左下角文字按钮
        </button>
        <button class="option-btn" data-back="c">
          <span class="label">C</span> 顶部浮层导航栏
        </button>
        <div class="note" id="back-note">方案 A 最节省空间，与移动端习惯一致；方案 C 信息显示最完整。</div>
      </div>
    </div>

    <div class="clear"></div>
  </div>

  <script>
    const screen = document.getElementById('screen');
    const coverControls = document.getElementById('cover-controls');
    const briefingControls = document.getElementById('briefing-controls');
    const scenarioTabs = document.querySelectorAll('.scenario-tab');
    let scenario = 'cover';
    let coverLayout = 'vertical';
    let backVariant = 'a';

    function render() {
      if (scenario === 'cover') {
        coverControls.style.display = 'block';
        briefingControls.style.display = 'none';
        const direction = coverLayout === 'vertical' ? 'column' : 'row';
        screen.innerHTML = `
          <div class="cover-bg"></div>
          <div class="cover-overlay"></div>
          <div class="cover-content">
            <div class="cover-greeting">迷路了吗，k</div>
            <div class="cover-buttons" style="flex-direction: ${direction}; ${coverLayout === 'horizontal' ? 'align-items: flex-start;' : ''}">
              <button class="btn">点亮灯火</button>
              <button class="btn btn-secondary">夜航简报</button>
            </div>
          </div>
        `;
      } else {
        coverControls.style.display = 'none';
        briefingControls.style.display = 'block';
        let navHtml = '';
        if (backVariant === 'a') {
          navHtml = `<div class="nav-a"><div class="back">← 封面</div></div>`;
        } else if (backVariant === 'b') {
          navHtml = `<div class="nav-b"><div class="briefing-meta">2026-06-21</div></div>`;
        } else {
          navHtml = `<div class="nav-c"><div class="back">← 封面</div><div class="date">夜航简报 · 2026-06-21</div></div>`;
        }
        const bottomBack = backVariant === 'b' ? `<div class="nav-bottom"><button class="btn btn-secondary">← 回到封面</button></div>` : '';
        screen.innerHTML = `
          <div class="briefing-screen">
            ${navHtml}
            <div class="briefing-body">
              <h2 class="briefing-title">夜航简报</h2>
              <div class="briefing-meta">2026 年 6 月 21 日 · AI 行业日报</div>
              <div class="briefing-card">
                <h3>今日航标</h3>
                <p>Today builders are talking about eval-driven development and context compression in coding assistants.</p>
                <p>今天 Builder 圈子的核心话题是：评估驱动开发和代码助手的上下文压缩。</p>
              </div>
              <div class="briefing-card">
                <h3>Builder 动态</h3>
                <p>@karpathy: Data quality beats quantity.</p>
                <p>@karpathy：数据质量胜过数量。</p>
              </div>
            </div>
            ${bottomBack}
          </div>
        `;
      }
    }

    scenarioTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        scenarioTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        scenario = tab.dataset.scenario;
        render();
      });
    });

    document.querySelectorAll('[data-cover]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-cover]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        coverLayout = btn.dataset.cover;
        render();
      });
    });

    document.querySelectorAll('[data-back]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-back]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        backVariant = btn.dataset.back;
        const notes = {
          a: '方案 A：左上角返回箭头，最简洁，节省垂直空间，和移动应用习惯一致。',
          b: '方案 B：左下角文字按钮，与封面按钮位置呼应，但会占用内容区底部空间。',
          c: '方案 C：顶部浮层导航栏，信息最完整（返回 + 标题 + 日期），但略显沉重。'
        };
        document.getElementById('back-note').textContent = notes[backVariant];
        render();
      });
    });

    render();
  </script>
</body>
</html>
