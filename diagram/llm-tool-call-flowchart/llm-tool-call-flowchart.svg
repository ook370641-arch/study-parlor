<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 520" style="background:#0f172a">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="36" fill="white" font-size="16" font-weight="700" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">LLM Function Calling: Stop &amp; Resume Flow</text>

  <!-- Region: LLM Generation (blue dashed) -->
  <rect x="210" y="68" width="960" height="200" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="225" y="88" fill="#22d3ee" font-size="9" font-weight="600" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">LLM GENERATION (Round 1)</text>

  <!-- Region: Framework Execution (green dashed) -->
  <rect x="830" y="295" width="340" height="90" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="845" y="315" fill="#34d399" font-size="9" font-weight="600" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">FRAMEWORK EXECUTION</text>

  <!-- Region: LLM Round 2 (blue dashed) -->
  <rect x="1010" y="68" width="340" height="200" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4" opacity="0.3"/>
  <text x="1025" y="88" fill="#22d3ee" font-size="9" font-weight="600" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">LLM GENERATION (Round 2)</text>

  <!-- ===== Column 1: User Input ===== -->
  <!-- mask -->
  <rect x="50" y="230" width="130" height="50" rx="6" fill="#0f172a"/>
  <!-- box -->
  <rect x="50" y="230" width="130" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="252" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">User Input</text>
  <text x="115" y="268" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">"What's the time?"</text>

  <!-- ===== Column 2: LLM Token Generation ===== -->
  <!-- mask -->
  <rect x="240" y="230" width="150" height="50" rx="6" fill="#0f172a"/>
  <!-- box -->
  <rect x="240" y="230" width="150" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="315" y="252" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">LLM Generates</text>
  <text x="315" y="268" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">token by token</text>

  <!-- ===== Column 3: Decision Diamond ===== -->
  <g transform="translate(490, 255)">
    <polygon points="0,-35 70,0 0,35 -70,0" fill="#0f172a"/>
    <polygon points="0,-35 70,0 0,35 -70,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="0" y="-6" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">Next token is</text>
    <text x="0" y="10" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">tool call tag?</text>
  </g>

  <!-- ===== Upper Path: Plain Text ===== -->
  <!-- mask -->
  <rect x="640" y="115" width="140" height="50" rx="6" fill="#0f172a"/>
  <!-- box -->
  <rect x="640" y="115" width="140" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="710" y="137" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">Continue</text>
  <text x="710" y="153" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">generating text</text>

  <!-- mask -->
  <rect x="640" y="195" width="140" height="50" rx="6" fill="#0f172a"/>
  <!-- box -->
  <rect x="640" y="195" width="140" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="710" y="217" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">Done</text>
  <text x="710" y="233" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">return to user</text>

  <!-- ===== Lower Path: Tool Call ===== -->
  <!-- mask -->
  <rect x="640" y="295" width="150" height="50" rx="6" fill="#0f172a"/>
  <!-- box -->
  <rect x="640" y="295" width="150" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="715" y="317" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">Structured Gen</text>
  <text x="715" y="333" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">constrained JSON</text>

  <!-- mask -->
  <rect x="640" y="375" width="150" height="50" rx="6" fill="#0f172a"/>
  <!-- box -->
  <rect x="640" y="375" width="150" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="715" y="397" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">Tool Call Ready</text>
  <text x="715" y="413" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">generation ENDS</text>

  <!-- ===== Column 5: Framework Executes Tool ===== -->
  <!-- mask -->
  <rect x="860" y="340" width="150" height="50" rx="6" fill="#0f172a"/>
  <!-- box -->
  <rect x="860" y="340" width="150" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="935" y="362" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">Framework</text>
  <text x="935" y="378" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">executes handler()</text>

  <!-- ===== Column 6: Result + History -> LLM Round 2 ===== -->
  <!-- mask -->
  <rect x="1060" y="115" width="160" height="50" rx="6" fill="#0f172a"/>
  <!-- box -->
  <rect x="1060" y="115" width="160" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1140" y="137" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">LLM Round 2</text>
  <text x="1140" y="153" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">new context with result</text>

  <!-- mask -->
  <rect x="1060" y="195" width="140" height="50" rx="6" fill="#0f172a"/>
  <!-- box -->
  <rect x="1060" y="195" width="140" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1130" y="217" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">Final Answer</text>
  <text x="1130" y="233" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">return to user</text>

  <!-- ===== Arrows ===== -->
  <!-- User -> LLM -->
  <line x1="180" y1="255" x2="240" y2="255" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM -> Decision -->
  <line x1="390" y1="255" x2="420" y2="255" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Decision -> Upper (No/Plain Text) -->
  <path d="M 490 220 L 490 140 L 640 140" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="515" y="135" fill="#22d3ee" font-size="9" font-weight="500" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">No</text>

  <!-- Upper: Continue -> Done -->
  <line x1="710" y1="165" x2="710" y2="195" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Decision -> Lower (Yes/Tool Tag) -->
  <path d="M 490 290 L 490 320 L 640 320" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="510" y="345" fill="#fbbf24" font-size="9" font-weight="500" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">Yes</text>

  <!-- Lower: Structured Gen -> Tool Call Ready -->
  <line x1="715" y1="345" x2="715" y2="375" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Tool Call Ready -> Framework -->
  <line x1="790" y1="400" x2="860" y2="365" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="810" y="395" fill="#34d399" font-size="8" font-weight="500" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">invoke</text>

  <!-- Framework -> LLM Round 2 (curved up) -->
  <path d="M 1010 365 L 1060 365 L 1060 320" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="1030" y="355" fill="#22d3ee" font-size="8" font-weight="500" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">result</text>

  <!-- LLM Round 2 -> Final Answer -->
  <line x1="1140" y1="165" x2="1130" y2="195" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- ===== Annotation: "Generation ENDS" ===== -->
  <rect x="640" y="440" width="370" height="36" rx="6" fill="rgba(120,53,15,0.15)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="825" y="455" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">Key Insight: Generation ENDS after tool call instruction.</text>
  <text x="825" y="470" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">It's not a pause — it's a complete stop, then a brand-new LLM call with fresh context.</text>

  <!-- ===== Legend ===== -->
  <rect x="1060" y="445" width="270" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1"/>
  <text x="1075" y="462" fill="white" font-size="9" font-weight="600" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">Legend:</text>
  <rect x="1140" y="452" width="12" height="8" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="1158" y="462" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">LLM generation</text>
  <rect x="1140" y="470" width="12" height="8" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="1158" y="480" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">Framework execution</text>
</svg>