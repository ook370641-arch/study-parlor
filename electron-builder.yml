appId: com.local.studyparlor
productName: 学者夜话
directories:
  output: release
files:
  - out/**/*
  - package.json
  - electron/prompts
extraMetadata:
  main: out/main/index.js
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: 学者夜话-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: 学者夜话-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 学者夜话
  uninstallDisplayName: 学者夜话
  artifactName: study-parlor-setup-${version}-${arch}.${ext}
publish:
  provider: github
  releaseType: release
