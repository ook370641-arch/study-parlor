<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学者夜话 · 文案评审原型</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --ink: #2a1f1a;
    --ink-light: #3a2f2a;
    --parchment: #e8d5b7;
    --parchment-dim: rgba(232,213,183,0.6);
    --parchment-faint: rgba(232,213,183,0.3);
    --ember: #d97757;
    --ember-dim: rgba(217,119,87,0.4);
    --slate: #3a5a6a;
    --slate-dim: rgba(58,90,106,0.4);
    --wine: #8a3a3a;
    --wine-dim: rgba(138,58,58,0.3);
    --gold: #c9a96e;
    --green: #5a8a5a;
    --green-dim: rgba(90,138,90,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    background: #1a120f;
    color: var(--parchment);
    overflow: hidden;
    height: 100vh;
  }

  /* ===== Top Bar ===== */
  .top-bar {
    height: 48px;
    background: var(--ink);
    border-bottom: 1px solid var(--slate-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
  }
  .top-bar h1 {
    font-family: 'Noto Serif SC', Georgia, serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.1em;
  }
  .legend {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 11px;
    color: var(--parchment-faint);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .progress { font-size: 12px; color: var(--parchment-dim); }
  .progress span { font-weight: 600; }
  .progress .done { color: var(--green); }
  .progress .rethink { color: var(--gold); }
  .top-bar .actions { display: flex; gap: 10px; }
  .top-bar button {
    padding: 5px 14px;
    font-size: 12px;
    border: 1px solid var(--slate-dim);
    background: transparent;
    color: var(--parchment-dim);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .top-bar button:hover { border-color: var(--ember); color: var(--parchment); }
  .top-bar button.primary {
    background: var(--ember); color: var(--ink); border-color: var(--ember); font-weight: 500;
  }
  .top-bar button.primary:hover { background: #e08a6a; }

  /* ===== Main Layout ===== */
  .main { display: flex; height: calc(100vh - 48px); }

  /* ===== Sidebar ===== */
  .sidebar {
    width: 240px;
    background: var(--ink);
    border-right: 1px solid var(--slate-dim);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar-section {
    padding: 12px 16px 6px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--parchment-faint);
    font-weight: 500;
  }
  .nav-item {
    padding: 10px 16px 10px 24px;
    font-size: 13px;
    color: var(--parchment-dim);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(58,90,106,0.15); color: var(--parchment); }
  .nav-item.active {
    background: rgba(217,119,87,0.1);
    color: var(--parchment);
    border-left-color: var(--ember);
  }
  .nav-item .counts {
    margin-left: auto;
    font-size: 10px;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .nav-item .counts .d { color: var(--green); }
  .nav-item .counts .r { color: var(--gold); }
  .nav-item .counts .t { color: var(--parchment-faint); }
  .nav-item .badge-done {
    margin-left: auto;
    font-size: 11px;
    color: var(--green);
  }

  /* ===== Preview Pane ===== */
  .preview-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .scene-label {
    padding: 12px 24px;
    background: rgba(42,31,26,0.8);
    border-bottom: 1px solid var(--slate-dim);
    font-size: 12px;
    color: var(--parchment-dim);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .scene-label .file { font-family: monospace; font-size: 11px; color: var(--parchment-faint); }
  .scene-container { flex: 1; overflow: auto; padding: 24px; display: flex; align-items: flex-start; justify-content: center; }

  /* ===== Rewritable Text ===== */
  .rw-text {
    display: inline;
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
    padding: 0 3px;
    margin: 0 -3px;
    border-radius: 2px;
  }
  .rw-text:hover { background: rgba(217,119,87,0.12); }
  .rw-text::after {
    content: '';
    position: absolute;
    top: 1px; right: -3px;
    width: 5px; height: 5px;
    border-radius: 50%;
    transition: opacity 0.15s;
  }

  /* States */
  .rw-text { border-bottom: 1px dashed var(--ember-dim); }
  .rw-text::after { background: var(--ember); opacity: 0; }
  .rw-text:hover::after { opacity: 1; }

  .rw-text.is-done { border-bottom: 1px solid var(--green-dim); }
  .rw-text.is-done::after { background: var(--green); opacity: 1; }

  .rw-text.is-rethink { border-bottom: 1px dashed var(--gold); }
  .rw-text.is-rethink::after { background: var(--gold); opacity: 1; }

  /* ===== Picker Overlay ===== */
  .picker-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(20,15,12,0.7);
    display: none; align-items: center; justify-content: center;
  }
  .picker-overlay.active { display: flex; }
  .picker-panel {
    width: 720px; max-width: 92vw; max-height: 85vh;
    background: var(--ink);
    border: 1px solid var(--slate-dim);
    border-radius: 4px;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .picker-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--slate-dim);
    display: flex; justify-content: space-between; align-items: center;
  }
  .picker-header h3 { font-family: 'Noto Serif SC', serif; font-size: 15px; font-weight: 600; }
  .picker-header .orig { font-size: 12px; color: var(--parchment-faint); margin-top: 4px; }
  .picker-header .close { font-size: 22px; color: var(--parchment-faint); cursor: pointer; padding: 4px; line-height: 1; }
  .picker-header .close:hover { color: var(--parchment); }
  .picker-body { overflow-y: auto; }
  .picker-section-label {
    padding: 10px 20px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--parchment-faint);
    background: rgba(0,0,0,0.2);
  }
  .picker-option {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(58,90,106,0.15);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .picker-option:hover { background: rgba(58,90,106,0.1); }
  .picker-option.selected {
    background: rgba(90,138,90,0.08);
    border-left: 3px solid var(--green);
    padding-left: 17px;
  }
  .picker-option.selected-rethink {
    background: rgba(201,169,110,0.08);
    border-left: 3px solid var(--gold);
    padding-left: 17px;
  }
  .picker-option .tier-tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border: 1px solid;
    border-radius: 2px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .tier-light { border-color: var(--gold); color: var(--gold); }
  .tier-medium { border-color: var(--ember); color: var(--ember); }
  .tier-heavy { border-color: #c45c3e; color: #c45c3e; }
  .tier-original { border-color: var(--parchment-faint); color: var(--parchment-faint); }
  .tier-rethink { border-color: var(--gold); color: var(--gold); }
  .picker-option .text {
    font-size: 14px;
    line-height: 1.7;
    font-family: 'Noto Serif SC', serif;
    color: var(--parchment);
  }
  .picker-option .text .highlight { color: var(--ember); font-weight: 600; }
  .picker-option .note {
    font-size: 11px;
    color: var(--parchment-faint);
    margin-top: 4px;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .picker-rethink {
    padding: 16px 20px;
    border-top: 1px solid var(--slate-dim);
    background: rgba(201,169,110,0.05);
  }
  .picker-rethink button {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px dashed var(--gold);
    color: var(--gold);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .picker-rethink button:hover {
    background: rgba(201,169,110,0.1);
    border-style: solid;
  }
  .picker-rethink button.selected {
    background: rgba(201,169,110,0.15);
    border-style: solid;
    border-color: var(--gold);
  }
  .picker-rethink .hint {
    font-size: 11px;
    color: var(--parchment-faint);
    margin-top: 8px;
    text-align: center;
  }

  /* ===== Export Panel ===== */
  .export-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(20,15,12,0.8);
    display: none; align-items: center; justify-content: center;
  }
  .export-overlay.active { display: flex; }
  .export-panel {
    width: 700px; max-width: 92vw; max-height: 85vh;
    background: var(--ink);
    border: 1px solid var(--slate-dim);
    border-radius: 4px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .export-body { overflow-y: auto; padding: 20px; }
  .export-body textarea {
    width: 100%; height: 320px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--slate-dim);
    border-radius: 4px;
    padding: 12px;
    color: var(--parchment);
    font-family: monospace;
    font-size: 12px;
    line-height: 1.6;
    resize: none;
  }
  .export-stats {
    display: flex;
    gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--slate-dim);
    font-size: 12px;
  }
  .export-stats .stat { display: flex; align-items: center; gap: 6px; }
  .export-stats .stat .dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ===== Scene CSS ===== */
  .scene-frame {
    background: var(--ink);
    border: 1px solid var(--slate-dim);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .btn-primary {
    background: var(--ember);
    color: var(--ink);
    border: none;
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 2px;
    font-family: inherit;
    display: inline-block;
    width: fit-content;
  }
  .btn-ghost {
    background: transparent;
    color: var(--parchment-dim);
    border: 1px solid var(--slate-dim);
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 2px;
    font-family: inherit;
  }

  /* Cover */
  .scene-cover {
    width: 520px; height: 320px;
    position: relative;
    background: linear-gradient(135deg, #2a1f1a 0%, #1a120f 60%, #2a1f1a 100%);
  }
  .scene-cover .vignette {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.55);
    pointer-events: none;
  }
  .scene-cover .content {
    position: absolute;
    bottom: 32px; left: 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  .scene-cover .greeting {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    color: var(--parchment);
  }
  .scene-cover .hint { font-size: 13px; color: var(--parchment-faint); }
  .scene-cover input {
    background: rgba(42,31,26,0.6);
    border: 1px solid var(--slate-dim);
    border-radius: 4px;
    padding: 8px 12px;
    color: var(--parchment);
    font-size: 14px;
    width: 220px;
    font-family: inherit;
  }

  /* Home */
  .scene-home {
    width: 720px; height: 420px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--ink);
  }
  .scene-home .top-right { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
  .scene-home .greeting { text-align: center; font-size: 12px; color: var(--parchment-faint); margin-bottom: 16px; }
  .scene-home .columns { display: flex; gap: 16px; flex: 1; min-height: 0; }
  .scene-home .col-left { width: 240px; display: flex; flex-direction: column; gap: 10px; }
  .scene-home .unsaved-box {
    background: rgba(42,31,26,0.7);
    border: 1px solid rgba(58,90,106,0.3);
    border-radius: 4px;
    padding: 10px;
  }
  .scene-home .unsaved-box .label { font-size: 10px; color: var(--parchment-faint); margin-bottom: 6px; }
  .scene-home .unsaved-box .actions { display: flex; gap: 8px; font-size: 11px; }
  .scene-home .unsaved-box .actions a { color: var(--ember); text-decoration: none; }
  .scene-home .unsaved-box .actions a.muted { color: var(--parchment-faint); }
  .scene-home .rec-header { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
  .scene-home .rec-header span { font-size: 10px; color: var(--parchment-faint); }
  .scene-home .rec-card {
    background: rgba(42,31,26,0.5);
    border: 1px solid rgba(58,90,106,0.2);
    border-radius: 4px;
    padding: 10px;
    font-size: 12px;
  }
  .scene-home .col-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .scene-home .col-right .label { font-size: 10px; color: var(--parchment-faint); margin-bottom: 8px; }
  .scene-home .topic-item {
    background: rgba(42,31,26,0.7);
    border: 1px solid rgba(58,90,106,0.2);
    border-radius: 4px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .scene-home .topic-item .bar { width: 3px; height: 16px; background: var(--ember); border-radius: 2px; flex-shrink: 0; }
  .scene-home .topic-item .title { font-family: 'Noto Serif SC', serif; font-size: 13px; flex: 1; }
  .scene-home .topic-item .meta { font-size: 10px; color: var(--parchment-faint); flex-shrink: 0; }

  /* PreStudy Modal */
  .scene-prestudy {
    width: 400px;
    padding: 28px;
    background: var(--ink);
    border: 1px solid rgba(58,90,106,0.4);
    border-radius: 4px;
  }
  .scene-prestudy .mode-label { font-size: 11px; color: var(--parchment-faint); margin-bottom: 20px; }
  .scene-prestudy .field { margin-bottom: 16px; }
  .scene-prestudy .field-label { font-size: 12px; color: var(--parchment-dim); margin-bottom: 6px; }
  .scene-prestudy input {
    width: 100%;
    background: rgba(42,31,26,0.4);
    border: 1px solid var(--slate-dim);
    border-radius: 4px;
    padding: 8px 10px;
    color: var(--parchment);
    font-size: 13px;
    font-family: inherit;
  }
  .scene-prestudy .opts { display: flex; gap: 8px; }
  .scene-prestudy .opt-btn {
    padding: 5px 14px;
    font-size: 12px;
    border: 1px solid var(--slate-dim);
    background: transparent;
    color: var(--parchment-dim);
    border-radius: 4px;
    cursor: default;
    font-family: inherit;
  }
  .scene-prestudy .opt-btn.active {
    background: var(--ember);
    color: var(--ink);
    border-color: var(--ember);
  }
  .scene-prestudy .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* Study */
  .scene-study {
    width: 640px; height: 400px;
    display: flex;
    flex-direction: column;
    background: var(--ink);
  }
  .scene-study header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: rgba(42,31,26,0.7);
    border-bottom: 1px solid rgba(58,90,106,0.3);
  }
  .scene-study .back-btn { font-size: 20px; color: var(--parchment-dim); cursor: default; }
  .scene-study .topic-title { font-family: 'Noto Serif SC', serif; font-size: 14px; }
  .scene-study .meta { font-size: 12px; color: var(--parchment-dim); }
  .scene-study .chat-area { flex: 1; padding: 16px 20px; overflow-y: auto; }
  .scene-study .chat-bubble {
    background: rgba(42,31,26,0.6);
    border: 1px solid rgba(58,90,106,0.3);
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 10px;
    max-width: 80%;
    font-size: 13px;
    line-height: 1.6;
  }
  .scene-study .chat-bubble.ai { margin-right: auto; }
  .scene-study .chat-bubble.user { margin-left: auto; border-color: rgba(217,119,87,0.2); }
  .scene-study .thinking {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--parchment-faint);
  }
  .scene-study .archive-bar {
    padding: 8px 20px;
    background: rgba(217,119,87,0.08);
    border-top: 1px solid rgba(217,119,87,0.15);
    border-bottom: 1px solid rgba(217,119,87,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }
  .scene-study .input-area {
    padding: 10px 20px;
    background: rgba(42,31,26,0.7);
    border-top: 1px solid rgba(58,90,106,0.3);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .scene-study .input-area textarea {
    flex: 1;
    background: rgba(42,31,26,0.6);
    border: 1px solid rgba(58,90,106,0.3);
    border-radius: 4px;
    padding: 8px 10px;
    color: var(--parchment);
    font-size: 13px;
    resize: none;
    height: 44px;
    font-family: inherit;
  }

  /* Library Empty */
  .scene-lib-empty {
    width: 480px; height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--ink);
  }
  .scene-lib-empty .stars { width: 64px; height: 64px; position: relative; margin-bottom: 16px; }
  .scene-lib-empty .stars::before {
    content: '';
    position: absolute;
    top: 30%; left: 50%;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(217,119,87,0.2);
    transform: translateX(-50%);
  }
  .scene-lib-empty .stars::after {
    content: '';
    position: absolute;
    bottom: 30%; left: 30%;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: rgba(232,213,183,0.15);
  }

  /* Library Populated */
  .scene-lib-pop {
    width: 520px; height: 360px;
    padding: 12px;
    background: var(--ink);
    display: flex;
    flex-direction: column;
  }
  .scene-lib-pop .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .scene-lib-pop .tab {
    padding: 4px 10px;
    font-size: 11px;
    border: 1px solid var(--slate-dim);
    border-radius: 3px;
    color: var(--parchment-dim);
    font-family: inherit;
    background: transparent;
    cursor: default;
  }
  .scene-lib-pop .tab.active {
    background: rgba(217,119,87,0.15);
    border-color: var(--ember-dim);
    color: var(--parchment);
  }
  .scene-lib-pop .topic-row {
    background: rgba(42,31,26,0.7);
    border: 1px solid rgba(58,90,106,0.2);
    border-radius: 4px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .scene-lib-pop .topic-row .bar { width: 3px; height: 16px; background: var(--ember); border-radius: 2px; flex-shrink: 0; }
  .scene-lib-pop .topic-row .title { font-family: 'Noto Serif SC', serif; font-size: 13px; flex: 1; }
  .scene-lib-pop .topic-row .meta { font-size: 10px; color: var(--parchment-faint); flex-shrink: 0; }
  .scene-lib-pop .session-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-bottom: 1px solid rgba(58,90,106,0.1);
    font-size: 11px;
  }
  .scene-lib-pop .session-row .badge {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: inherit;
    border: none;
    cursor: default;
  }
  .scene-lib-pop .session-row .badge.reviewed { background: rgba(217,119,87,0.1); color: var(--ember); }
  .scene-lib-pop .session-row .badge.unreviewed { background: var(--ink); color: var(--parchment-faint); }
  .scene-lib-pop .file-btn {
    padding: 3px 7px;
    font-size: 9px;
    border: 1px solid rgba(58,90,106,0.3);
    background: transparent;
    color: var(--parchment-dim);
    border-radius: 2px;
    font-family: inherit;
    cursor: default;
  }
  .scene-lib-pop .file-btn.emphasis {

// ==================== STATE ====================
// selections: { key: 'light' | 'medium' | 'heavy' | 'original' }
// rethinks: Set<string>
let selections = {};
let rethinks = new Set();
let currentScene = null;

// Load from localStorage
const savedSel = localStorage.getItem('text-review-selections-v2');
const savedRethink = localStorage.getItem('text-review-rethinks-v2');
if (savedSel) { try { selections = JSON.parse(savedSel); } catch(e) {} }
if (savedRethink) { try { rethinks = new Set(JSON.parse(savedRethink)); } catch(e) {} }

function saveState() {
  localStorage.setItem('text-review-selections-v2', JSON.stringify(selections));
  localStorage.setItem('text-review-rethinks-v2', JSON.stringify([...rethinks]));
  updateProgress();
}

function getItem(key) {
  for (const sceneId in DATA) {
    const item = DATA[sceneId].items.find(i => i.key === key);
    if (item) return item;
  }
  return null;
}

function getText(key, tier) {
  const item = getItem(key);
  if (!item) return '';
  if (tier === 'light') return item.light;
  if (tier === 'medium') return item.medium;
  if (tier === 'heavy') return item.heavy;
  return item.orig;
}

function getState(key) {
  if (rethinks.has(key)) return 'rethink';
  if (selections[key]) return 'done';
  return 'none';
}

function R(key, tag = 'span') {
  const item = getItem(key);
  if (!item) return '';
  const state = getState(key);
  const tier = selections[key];
  const text = state === 'done' ? getText(key, tier) : (state === 'rethink' ? item.orig + ' ✦' : item.orig);
  const cls = state === 'done' ? 'rw-text is-done' : (state === 'rethink' ? 'rw-text is-rethink' : 'rw-text');
  return `<${tag} class="${cls}" data-key="${key}" onclick="openPicker('${key}')">${text}</${tag}>`;
}

// ==================== NAVIGATION ====================
const SCENE_ORDER = [
  'cover', 'home', 'prestudy', 'study',
  'library-empty', 'library-pop',
  'archive-loading', 'archive-report', 'confirm-dialog',
  'profile', 'review-flash',
  'report-header', 'report-sections',
  'chatinput', 'misc'
];

function sceneStats(sceneId) {
  const items = DATA[sceneId].items;
  let done = 0, rethink = 0;
  for (const i of items) {
    if (rethinks.has(i.key)) rethink++;
    else if (selections[i.key]) done++;
  }
  return { done, rethink, total: items.length };
}

function renderSidebar() {
  const el = document.getElementById('sidebar');
  let html = '<div class="sidebar-section">界面场景</div>';
  for (const id of SCENE_ORDER) {
    const scene = DATA[id];
    if (!scene) continue;
    const s = sceneStats(id);
    const allDone = s.done === s.total;
    const active = currentScene === id ? 'active' : '';
    html += `
      <div class="nav-item ${active}" onclick="switchScene('${id}')">
        ${scene.label}
        ${allDone
          ? '<span class="badge-done">&#10003;</span>'
          : `<span class="counts"><span class="d">${s.done}</span><span class="t">/</span><span class="r">${s.rethink}</span><span class="t">/${s.total}</span></span>`
        }
      </div>
    `;
  }
  el.innerHTML = html;
}

function switchScene(id) {
  currentScene = id;
  const scene = DATA[id];
  document.getElementById('scene-label').innerHTML = `
    <span>${scene.label}</span>
    <span class="file">${scene.file}</span>
  `;
  document.getElementById('scene-container').innerHTML = RENDERS[id]();
  renderSidebar();
}

// ==================== PICKER ====================
let currentPickerKey = null;

function openPicker(key) {
  const item = getItem(key);
  if (!item) return;
  currentPickerKey = key;
  const picker = document.getElementById('picker');
  document.getElementById('picker-orig').textContent = item.orig;

  const state = getState(key);

  const tiers = [
    { id: 'light', tag: '轻量', tagClass: 'tier-light', text: item.light },
    { id: 'medium', tag: '中量', tagClass: 'tier-medium', text: item.medium },
    { id: 'heavy', tag: '重量', tagClass: 'tier-heavy', text: item.heavy },
  ];

  let html = '<div class="picker-section-label">选择一套方案</div>';
  for (const t of tiers) {
    const selected = state === 'done' && selections[key] === t.id ? 'selected' : '';
    html += `
      <div class="picker-option ${selected}" onclick="selectTier('${key}', '${t.id}')">
        <span class="tier-tag ${t.tagClass}">${t.tag}</span>
        <div class="text">${t.text}</div>
      </div>
    `;
  }

  const origSelected = state === 'none' ? 'selected' : '';
  html += `
    <div class="picker-option ${origSelected}" onclick="selectTier('${key}', 'original')">
      <span class="tier-tag tier-original">原样</span>
      <div class="text" style="color:var(--parchment-faint);">${item.orig}</div>
    </div>
  `;

  document.getElementById('picker-body').innerHTML = html;

  // Rethink section
  const isRethink = state === 'rethink';
  document.getElementById('picker-rethink').innerHTML = `
    <button class="${isRethink ? 'selected' : ''}" onclick="toggleRethink('${key}')">
      ${isRethink ? '✦ 已标记"再想想"' : '✦ 再想想 — 这个文案需要重新生成'}
    </button>
    <div class="hint">
      ${isRethink
        ? '已标记。请在聊天中告诉我你的修改意见，我会批量重新生成。'
        : '点击标记后，在聊天中告诉我这个文案的问题或方向，我会重新生成。'
      }
    </div>
  `;

  picker.classList.add('active');
}

function closePicker() {
  document.getElementById('picker').classList.remove('active');
  currentPickerKey = null;
}

function selectTier(key, tier) {
  rethinks.delete(key);
  if (tier === 'original') {
    delete selections[key];
  } else {
    selections[key] = tier;
  }
  saveState();
  closePicker();
  if (currentScene) {
    document.getElementById('scene-container').innerHTML = RENDERS[currentScene]();
  }
  renderSidebar();
}

function toggleRethink(key) {
  if (rethinks.has(key)) {
    rethinks.delete(key);
  } else {
    rethinks.add(key);
    delete selections[key];
  }
  saveState();
  closePicker();
  if (currentScene) {
    document.getElementById('scene-container').innerHTML = RENDERS[currentScene]();
  }
  renderSidebar();
}

// ==================== PROGRESS ====================
function updateProgress() {
  let total = 0, done = 0, rethink = 0;
  for (const id in DATA) {
    for (const item of DATA[id].items) {
      total++;
      if (rethinks.has(item.key)) rethink++;
      else if (selections[item.key]) done++;
    }
  }
  document.getElementById('prog-done').textContent = done;
  document.getElementById('prog-rethink').textContent = rethink;
  document.getElementById('prog-total').textContent = total;
}

function resetAll() {
  if (!confirm('确定要清空所有已选方案和"再想想"标记吗？')) return;
  selections = {};
  rethinks = new Set();
  saveState();
  if (currentScene) {
    document.getElementById('scene-container').innerHTML = RENDERS[currentScene]();
  }
  renderSidebar();
}

// ==================== EXPORT ====================
function showExport() {
  const finalized = [];
  const rethinkList = [];

  for (const sceneId in DATA) {
    for (const item of DATA[sceneId].items) {
      if (rethinks.has(item.key)) {
        rethinkList.push({
          key: item.key,
          original: item.orig,
          currentLight: item.light,
          currentMedium: item.medium,
          currentHeavy: item.heavy,
          file: DATA[sceneId].file,
          context: item.ctx
        });
      } else if (selections[item.key]) {
        finalized.push({
          key: item.key,
          original: item.orig,
          selected: selections[item.key],
          text: getText(item.key, selections[item.key]),
          file: DATA[sceneId].file,
          context: item.ctx
        });
      }
    }
  }

  const result = { finalized, rethink: rethinkList };
  const json = JSON.stringify(result, null, 2);
  document.getElementById('export-text').value = json;

  document.getElementById('export-stats').innerHTML = `
    <div class="stat"><span class="dot" style="background:var(--green)"></span> 已定稿 ${finalized.length}</div>
    <div class="stat"><span class="dot" style="background:var(--gold)"></span> 待重新生成 ${rethinkList.length}</div>
    <div class="stat"><span class="dot" style="background:var(--parchment-faint)"></span> 未处理 ${result.finalized.length + result.rethink.length}</div>
  `;

  document.getElementById('export-overlay').classList.add('active');
}

function closeExport() {
  document.getElementById('export-overlay').classList.remove('active');
}

function copyExport() {
  const el = document.getElementById('export-text');
  el.select();
  document.execCommand('copy');
  alert('已复制到剪贴板');
}

function downloadExport() {
  const json = document.getElementById('export-text').value;
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'text-rewrite-plan.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ==================== KEYBOARD ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closePicker();
    closeExport();
  }
});

// ==================== INIT ====================
renderSidebar();
updateProgress();
switchScene('cover');
